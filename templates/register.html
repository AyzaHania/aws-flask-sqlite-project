<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · Bloom</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header class="site-header"><span class="brand">Student Portal</span><a class="header-link" href="{{ url_for('login') }}">Already a member? Log in →</a></header>
<main class="page"><div class="auth-wrap"><div class="eyebrow">Welcome</div><h1>Create an Account</h1><p class="intro">Register to save your profile details and upload text files for word counting.</p><section class="card">
{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="flash" role="status">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post" action="{{ url_for('register') }}">
<div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required></div>
<div class="two"><div class="field"><label for="firstname">First name</label><input id="firstname" name="firstname" autocomplete="given-name" required></div><div class="field"><label for="lastname">Last name</label><input id="lastname" name="lastname" autocomplete="family-name" required></div></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="address">Address</label><textarea id="address" name="address" rows="3" autocomplete="street-address" required></textarea></div>
<button class="btn full" type="submit">Register →</button></form></section><p class="footnote">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div></main></body></html>
